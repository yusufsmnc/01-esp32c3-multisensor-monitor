# Static analysis of project sources with Cppcheck on every pull request
# and every push to main.
#
# Why compile_commands.json: `idf.py reconfigure` runs only the CMake
# step and emits the exact include paths and defines the compiler uses,
# so Cppcheck resolves ESP-IDF macros (ESP_LOGx, pdMS_TO_TICKS, ...)
# instead of guessing. Only main/ and components/ are analysed; findings
# inside ESP-IDF headers are suppressed because they are not our code.
name: static-analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cppcheck:
    name: Cppcheck (project sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: espressif/idf:v6.1.1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends cppcheck > /dev/null
          cppcheck --version

      - name: Generate compile_commands.json
        # The full database also lists files that only exist after a full
        # build (e.g. build/project_elf_src_esp32c3.c); Cppcheck refuses to
        # load a database with missing files, so keep only project entries.
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py reconfigure > /dev/null
          python3 - <<'EOF'
          import json, os
          ws = os.environ["GITHUB_WORKSPACE"]
          roots = tuple(os.path.join(ws, d) + "/" for d in ("main", "components"))
          with open("build/compile_commands.json") as f:
              db = json.load(f)
          project = [e for e in db if e["file"].startswith(roots)]
          for e in project:
              print("analyse:", os.path.relpath(e["file"], ws))
          if not project:
              raise SystemExit("no project sources found in compile_commands.json")
          with open("build/compile_commands_project.json", "w") as f:
              json.dump(project, f, indent=2)
          EOF

      - name: Run Cppcheck
        # ESP_ROOT (/opt/esp) holds both ESP-IDF and the toolchain headers.
        run: |
          ESP_ROOT="$(dirname "$IDF_PATH")"
          cppcheck \
            --project=build/compile_commands_project.json \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress="*:${ESP_ROOT}/*" \
            --error-exitcode=1 \
            --template=gcc \
            --quiet
          echo "Cppcheck: no findings in project sources."
