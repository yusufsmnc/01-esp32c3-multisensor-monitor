# Static analysis of project sources with Cppcheck on every pull request
# and every push to main.
#
# Why compile_commands.json: `idf.py reconfigure` runs only the CMake
# step and emits the exact include paths and defines the compiler uses,
# so Cppcheck resolves ESP-IDF macros (ESP_LOGx, pdMS_TO_TICKS, ...)
# instead of guessing. Only main/ and components/ are analysed; findings
# inside ESP-IDF headers are suppressed because they are not our code.
name: static-analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cppcheck:
    name: Cppcheck (project sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: espressif/idf:v6.1.1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends cppcheck > /dev/null
          cppcheck --version

      - name: Generate compile_commands.json
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py reconfigure > /dev/null

      - name: Run Cppcheck
        # ESP_ROOT (/opt/esp) holds both ESP-IDF and the toolchain headers.
        run: |
          ESP_ROOT="$(dirname "$IDF_PATH")"
          cppcheck \
            --project=build/compile_commands.json \
            --file-filter="${GITHUB_WORKSPACE}/main/*" \
            --file-filter="${GITHUB_WORKSPACE}/components/*" \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress="*:${ESP_ROOT}/*" \
            --error-exitcode=1 \
            --template=gcc \
            --quiet
          echo "Cppcheck: no findings in project sources."
